<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Mini Project 2.2: Terraform staging on a GitHub-hosted runner</title>
<desc id="desc">A manually triggered workflow provisions a real Flask container and internal Docker network, tests localhost HTTPS, destroys and recreates staging, and saves evidence before final cleanup.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1100" height="760" fill="#f8fafc"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="550" y="38" font-size="25" font-weight="700">Terraform staging — real infrastructure, no cloud account</text>
<rect x="35" y="70" width="400" height="90" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
<text x="235" y="101" font-size="18" font-weight="600">Existing GitHub repository</text><text x="235" y="128" font-size="15">Flask calculator · Dockerfile · protected main</text>
<rect x="665" y="70" width="400" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="865" y="101" font-size="17" font-weight="600">Existing workflows preserved</text><text x="865" y="128" font-size="15">Application CI · SonarCloud · Render CD</text>
<rect x="35" y="190" width="400" height="80" rx="12" fill="#fff" stroke="#6366f1"/>
<text x="235" y="219" font-size="17" font-weight="600">PR: validation only</text><text x="235" y="245" font-size="15">fmt → init → validate → plan</text>
<rect x="665" y="190" width="400" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<text x="865" y="219" font-size="17" font-weight="600">Manual workflow on reviewed main</text><text x="865" y="245" font-size="15">Explicit recreate-and-cleanup confirmation</text>
<rect x="35" y="310" width="1030" height="300" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="550" y="340" font-size="19" font-weight="600">Ephemeral GitHub-hosted Ubuntu 24.04 runner</text>
<rect x="65" y="365" width="280" height="90" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="205" y="396" font-size="18" font-weight="600">Terraform + Docker provider</text><text x="205" y="423" font-size="14">Local state; job lifetime only</text>
<rect x="590" y="365" width="435" height="210" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="807" y="393" font-size="17" font-weight="600">Dedicated internal Docker network</text><text x="807" y="418" font-size="14">172.28.22.0/24 · direct internet egress blocked</text>
<rect x="630" y="443" width="355" height="102" rx="10" fill="#fff" stroke="#059669"/>
<text x="807" y="472" font-size="18" font-weight="600">Existing Flask + Gunicorn HTTPS</text><text x="807" y="499" font-size="14">Non-root container · port 10000 · no database</text><text x="807" y="522" font-size="14">Generated certificate + private runtime session key</text>
<rect x="65" y="490" width="280" height="85" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
<text x="205" y="518" font-size="17" font-weight="600">Existing smoke test</text><text x="205" y="544" font-size="14">Health · commit · 5 + 3 · CSRF</text>
<rect x="35" y="645" width="595" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<text x="332" y="676" font-size="17" font-weight="600">Apply → test → destroy → verify removal</text><text x="332" y="702" font-size="16">Recreate → test again → final cleanup</text>
<rect x="680" y="645" width="385" height="80" rx="12" fill="#fef3c7" stroke="#d97706"/>
<text x="872" y="676" font-size="17" font-weight="600">Saved genuine evidence · 14 days</text><text x="872" y="702" font-size="14">Logs + safe snapshots; no state or private keys</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
<path d="M435 115 H665" stroke-dasharray="6 5"/><path d="M235 160 V190"/><path d="M435 145 L665 215"/><path d="M865 270 V310"/>
<path d="M345 410 H590"/><path d="M345 532 H630"/><path d="M550 610 V645"/><path d="M630 685 H680"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#334155" font-size="13"><text x="466" y="398">build + provision</text><text x="487" y="518">127.0.0.1:8443 HTTPS</text></g>
</svg>
