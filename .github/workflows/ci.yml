name: CI Pipeline

on:
  push:
    branches:
      - main
      - mini-project-1.3-ci
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary=:all: pip==25.2
          pip install --only-binary=:all: pytest==8.4.2 pytest-cov==7.0.0 flake8==7.3.0

      - name: Run Flake8
        run: flake8 calculator.py test_calculator.py

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml

      - name: Build application
        run: python -m py_compile calculator.py

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
