name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pip==25.2
          pip install --only-binary=:all: Flask==3.1.1 Flask-WTF==1.2.2
          pip install --only-binary=:all: pytest==8.4.2 pytest-cov==7.0.0 flake8==7.3.0

      - name: Run Flake8
        run: flake8 calculator.py test_calculator.py app.py test_app.py smoke_test.py test_deployment.py

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml

      - name: Build application
        run: python -m py_compile calculator.py app.py

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        with:
          args: -Dsonar.qualitygate.wait=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-artifact:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the validated revision once
        run: |
          docker build --platform linux/amd64 --build-arg APP_REVISION="$GITHUB_SHA" -t calculator:$GITHUB_SHA .
          docker save calculator:$GITHUB_SHA -o application.tar
          sha256sum application.tar > application.tar.sha256
          cp smoke_test.py artifact-smoke-test.py
      - name: Upload reusable application image and verifier
        uses: actions/upload-artifact@v4
        with:
          name: staging-application-${{ github.sha }}
          path: |
            application.tar
            application.tar.sha256
            artifact-smoke-test.py
          retention-days: 14
          if-no-files-found: error

  publish-image:
    needs: build-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-application-${{ github.sha }}
      - name: Retrieve and verify the build artifact
        run: |
          sha256sum -c application.tar.sha256
          docker load -i application.tar
      - name: Publish the same image to GitHub Container Registry
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-staging"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag calculator:$GITHUB_SHA "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
          test -n "$digest"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $digest" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      DEPLOY_IMAGE: ${{ needs.publish-image.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-application-${{ github.sha }}
      - name: Validate staging configuration
        run: |
          test -n "$RENDER_API_KEY" || { echo 'Missing staging secret RENDER_API_KEY'; exit 1; }
          [[ "$RENDER_SERVICE_ID" == srv-* ]] || { echo 'Missing or invalid RENDER_SERVICE_ID'; exit 1; }
          [[ "$STAGING_URL" == https://* ]] || { echo 'STAGING_URL must use HTTPS'; exit 1; }
          mkdir -p deployment-evidence
      - name: Deploy immutable image and await Render result
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          payload=$(jq -n --arg image "$DEPLOY_IMAGE" '{imageUrl:$image}')
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data "$payload" "$api" > deployment-evidence/deploy.json
          deploy_id=$(jq -er '.id' deployment-evidence/deploy.json)
          echo "Render deployment: $deploy_id; image: $DEPLOY_IMAGE"
          for attempt in $(seq 1 80); do
            curl --fail-with-body --silent --show-error --retry 3 --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" "$api/$deploy_id" \
              > deployment-evidence/deploy-status.json
            status=$(jq -er '.status' deployment-evidence/deploy-status.json)
            echo "Attempt $attempt: $status" | tee -a deployment-evidence/render-status.log
            case "$status" in
              live) exit 0 ;;
              *_failed|canceled|deactivated) echo 'Render deployment failed'; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Render deployment timed out'; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Smoke-test the deployed revision
        run: |
          set -o pipefail
          python artifact-smoke-test.py "$STAGING_URL" "$GITHUB_SHA" 2>&1 | tee deployment-evidence/smoke-tests.log
          printf 'Revision: %s\nImage: %s\nURL: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$DEPLOY_IMAGE" "$STAGING_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            | tee deployment-evidence/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve deployment diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment-evidence/
          retention-days: 30
          if-no-files-found: warn
