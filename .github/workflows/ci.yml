name: CI Pipeline

on:
  push:
    branches:
      - main
      - mini-project-1.3-ci
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Run Flake8
        run: flake8 calculator.py test_calculator.py

      - name: Run tests
        run: pytest

      - name: Build application
        run: python -m py_compile calculator.py