name: CI Pipeline
on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 calculator.py webapp.py test_calculator.py test_webapp.py scripts
      - name: Tests and coverage
        run: python -m pytest --cov=calculator --cov=webapp --cov-report=term-missing --cov-report=xml
      - name: Compile and package application
        run: python scripts/build.py
      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: calculator-web
          path: dist/calculator-web.zip
          if-no-files-found: error
  standards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate branch, title, and new commits
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/standards.py branch "$BRANCH"
          python scripts/standards.py title "$TITLE"
          python scripts/standards.py range "$BASE..$HEAD"
