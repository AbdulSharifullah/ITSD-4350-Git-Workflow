name: Production Blue Green Simulation

on:
  pull_request:
    branches: [main]
    paths: ['bluegreen/**', '.github/workflows/production-bluegreen.yml']
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: 'Successful Staging Deployment run ID for this exact main revision'
        type: string
        required: true
      approve_promotion:
        description: 'I approve promoting the validated candidate and the failure/rollback drill on this temporary runner'
        type: boolean
        required: true
        default: false

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Validate controller, existing regression tests and Compose
        env:
          BLUE_IMAGE: calculator:blue
          GREEN_IMAGE: calculator:green
        run: |
          set -euo pipefail
          pip install --only-binary=:all: Flask==3.1.1 Flask-WTF==1.2.2 pytest==8.4.2 flake8==7.3.0
          python -m pytest -q
          flake8 bluegreen --max-line-length=100
          mkdir -p bluegreen/runtime
          touch bluegreen/runtime/app.env
          docker compose -f bluegreen/compose.yml config --quiet
      - name: Run the MP2.4 monitoring validation gate
        env:
          APP_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.monitoring.yml config --quiet
          docker compose -f docker-compose.monitoring.yml up -d --build --wait
          python smoke_test.py http://127.0.0.1:18000 "$GITHUB_SHA" --attempts 3
          docker compose -f docker-compose.monitoring.yml exec -T prometheus \
            promtool check config /etc/prometheus/prometheus.yml
          docker compose -f docker-compose.monitoring.yml exec -T alertmanager \
            amtool check-config /etc/alertmanager/alertmanager.yml
          docker compose -f docker-compose.monitoring.yml exec -T prometheus \
            promtool test rules /etc/prometheus/alert-rules.test.yml
          for attempt in $(seq 1 20); do
            scrape=$(curl --fail --silent --show-error \
              'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22flask-app%22%7D' \
              | jq -er '.data.result[0].value[1] // empty' || true)
            [[ "$scrape" == "1" ]] && break
            sleep 2
          done
          [[ "$scrape" == "1" ]] || { echo 'Prometheus scrape failed'; exit 1; }
      - name: Verify exact staging and monitoring runs before approval
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            > "$RUNNER_TEMP/workflow-runs.json"
          python monitoring/verify_promotion_candidate.py \
            --candidate-sha "$GITHUB_SHA" \
            --staging-run "$RUNNER_TEMP/staging.json" \
            --workflow-runs "$RUNNER_TEMP/workflow-runs.json"
          attempt=$(jq -er '.run_attempt' "$RUNNER_TEMP/staging.json")
          mkdir -p "$RUNNER_TEMP/staging-evidence"
          gh run download "$STAGING_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n "deployment-evidence-$GITHUB_SHA-$attempt" -D "$RUNNER_TEMP/staging-evidence"
          grep -F "PASS:" "$RUNNER_TEMP/staging-evidence/smoke-tests.log"
          grep -F "Revision: $GITHUB_SHA" "$RUNNER_TEMP/staging-evidence/summary.txt"
          image=$(sed -n 's/^Image: //p' "$RUNNER_TEMP/staging-evidence/summary.txt")
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}-staging@sha256:"
          [[ "$image" == "$prefix"* ]]
          [[ "${image#"$prefix"}" =~ ^[0-9a-f]{64}$ ]]

  demonstrate:
    permissions:
      contents: read
      actions: read
      packages: read
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_promotion == true
    needs: validate
    environment: production-simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: production-bluegreen-simulation
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      PROMOTION_APPROVED: ${{ inputs.approve_promotion }}
      BLUE_REVISION: 988612607ef85e7accea16aad881f8f7bd6d519e
      GREEN_REVISION: ${{ github.sha }}
      BLUE_IMAGE: calculator:blue
      GREEN_IMAGE: calculator:${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify staging success and retrieve its immutable CI image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p bluegreen/evidence "$RUNNER_TEMP/application-artifact" "$RUNNER_TEMP/blue-source"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging.json"
          jq -e --arg sha "$GITHUB_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/cd.yml"' "$RUNNER_TEMP/staging.json"
          jq '{id,html_url,head_sha,conclusion,path}' "$RUNNER_TEMP/staging.json" > bluegreen/evidence/staging-provenance.json
          attempt=$(jq -er '.run_attempt' "$RUNNER_TEMP/staging.json")
          gh run download "$STAGING_RUN_ID" -R "$GITHUB_REPOSITORY" -n "deployment-evidence-$GITHUB_SHA-$attempt" -D "$RUNNER_TEMP/application-artifact"
          image=$(sed -n 's/^Image: //p' "$RUNNER_TEMP/application-artifact/summary.txt")
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}-staging@sha256:"
          [[ "$image" == "$prefix"* ]]
          digest="${image#"$prefix"}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          docker tag "$image" "$GREEN_IMAGE"
          actual=$(docker image inspect "$GREEN_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_REVISION=//p')
          [[ "$actual" == "$GITHUB_SHA" ]]
          cp "$RUNNER_TEMP/application-artifact/summary.txt" bluegreen/evidence/staging-summary.txt
          printf 'Staging run: %s\nExact staged image: %s\nGreen image ID: %s\n' "$STAGING_RUN_ID" "$image" "$(docker image inspect "$GREEN_IMAGE" --format '{{.Id}}')" > bluegreen/evidence/image-provenance.txt
          git archive "$BLUE_REVISION" | tar -x -C "$RUNNER_TEMP/blue-source"
          docker build --build-arg APP_REVISION="$BLUE_REVISION" -t "$BLUE_IMAGE" "$RUNNER_TEMP/blue-source"
      - name: Prepare genuine browser screenshots
        run: |
          pip install --only-binary=:all: playwright==1.56.0
          python -m playwright install --with-deps chromium
          python bluegreen/render_architecture.py
      - name: Execute complete approved demonstration on this runner
        shell: bash
        run: |
          set -euo pipefail
          { date -u; docker version; docker compose version; git rev-parse HEAD; } > bluegreen/evidence/tool-versions.txt
          python bluegreen/demonstrate.py 2>&1 | tee bluegreen/evidence/demonstration.log
          cat bluegreen/evidence/results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostics and clean up this simulation only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bluegreen/evidence
          if [[ -f bluegreen/runtime/app.env ]]; then
            docker compose -f bluegreen/compose.yml ps -a > bluegreen/evidence/final-containers.txt
            docker compose -f bluegreen/compose.yml logs --no-color > bluegreen/evidence/container-logs.txt 2>&1
            docker compose -f bluegreen/compose.yml down --remove-orphans
          fi
      - name: Upload evidence before the runner shuts down
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluegreen-demonstration-${{ github.run_id }}-${{ github.run_attempt }}
          path: bluegreen/evidence/
          retention-days: 30
          if-no-files-found: error
