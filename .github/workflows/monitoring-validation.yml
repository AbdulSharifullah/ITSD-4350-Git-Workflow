name: MP2.4 Monitoring Validation

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  monitoring-integration:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install application test tools
        run: |
          python -m pip install --only-binary=:all: Flask==3.1.1 Flask-WTF==1.2.2
          python -m pip install --only-binary=:all: pytest==8.4.2 flake8==7.3.0
      - name: Run app tests and lint
        run: |
          pytest -q
          flake8 app.py smoke_test.py test_app.py monitoring/alert_sink.py monitoring/collect_report.py --max-line-length=100
      - name: Validate Compose and monitoring configurations
        run: |
          docker compose -f docker-compose.monitoring.yml config --quiet
          docker compose -f docker-compose.monitoring.yml up -d --build --wait
          docker compose -f docker-compose.monitoring.yml exec -T prometheus \
            promtool check config /etc/prometheus/prometheus.yml
          docker compose -f docker-compose.monitoring.yml exec -T alertmanager \
            amtool check-config /etc/alertmanager/alertmanager.yml
          docker compose -f docker-compose.monitoring.yml exec -T prometheus \
            promtool test rules /etc/prometheus/alert-rules.test.yml
      - name: Verify app and Prometheus scrape
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python smoke_test.py http://127.0.0.1:18000 "$EXPECTED_REVISION" --attempts 3
          for attempt in $(seq 1 20); do
            result=$(curl --fail --silent --show-error \
              'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22flask-app%22%7D' \
              | jq -er '.data.result[0].value[1] // empty' || true)
            [[ "$result" == "1" ]] && break
            sleep 2
          done
          [[ "$result" == "1" ]] || { echo 'Prometheus did not scrape the Flask app'; exit 1; }
          curl --fail --silent --show-error 'http://127.0.0.1:9090/api/v1/query?query=app_readiness_status' \
            | jq -e '.data.result[0].value[1] == "1"'
      - name: Fire a simulated failed-validation alert through Prometheus
        run: |
          set -euo pipefail
          printf 'deployment_validation_status 0\n' | curl --fail --silent --show-error -X PUT \
            --data-binary @- http://127.0.0.1:9091/metrics/job/deployment-validation
          fired=false
          delivered=false
          for attempt in $(seq 1 20); do
            firing=$(curl --fail --silent --show-error \
              'http://127.0.0.1:9090/api/v1/query?query=ALERTS%7Balertname%3D%22DeploymentValidationFailed%22%2Calertstate%3D%22firing%22%7D' \
              | jq -r '.data.result | length')
            webhook_count=$(curl --fail --silent --show-error http://127.0.0.1:8081/health | jq -r '.received')
            email_count=$(curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/messages | jq -r '.messages | length')
            [[ "$firing" -ge 1 ]] && fired=true
            if [[ "$firing" -ge 1 && "$webhook_count" -ge 1 && "$email_count" -ge 1 ]]; then delivered=true; break; fi
            sleep 2
          done
          [[ "$delivered" == true ]] || { echo "Validation alert did not fire and reach both local sinks (fired=$fired webhook=$webhook_count email=$email_count)"; exit 1; }
          printf 'PASS: failed-validation rule fired; Alertmanager delivered to webhook (%s alerts) and SMTP capture (%s messages). This was a simulated validation failure.\n' "$webhook_count" "$email_count" | tee monitoring-validation.txt
      - name: Collect short-window monitoring report
        if: always()
        run: |
          mkdir -p monitoring-evidence
          cp monitoring-validation.txt monitoring-evidence/ 2>/dev/null || true
          curl --silent --show-error http://127.0.0.1:18000/metrics > monitoring-evidence/app-metrics.txt || true
          curl --silent --show-error 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22flask-app%22%7D' \
            > monitoring-evidence/prometheus-target.json || true
          date -u +'%Y-%m-%dT%H:%M:%SZ' > monitoring-evidence/collected-at-utc.txt
          if [[ -f monitoring-validation.txt ]]; then
            python monitoring/collect_report.py --revision "$GITHUB_SHA" \
              --alert-routing passed || true
          fi
      - name: Upload genuine monitoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mp24-monitoring-evidence-${{ github.run_id }}
          path: monitoring-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Clean up local monitoring stack
        if: always()
        run: docker compose -f docker-compose.monitoring.yml down --remove-orphans -v
