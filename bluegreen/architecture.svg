<rect x="600" y="110" width="550" height="115" rx="12" fill="#e2e8f0" stroke="#64748b"/>
<text x="620" y="142" font-size="21">Existing Render staging (unchanged)</text><text x="620" y="175" font-size="17">Deploy exact CI artifact → revision + calculator tests</text><text x="620" y="204" font-size="17">Only successful staging for the approved revision is accepted</text>
