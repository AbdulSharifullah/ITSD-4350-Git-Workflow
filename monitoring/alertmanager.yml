global:
  resolve_timeout: 1m
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@itsd4350.test

route:
  receiver: local-notifications
  group_by: [alertname, severity]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: local-notifications
    email_configs:
      - to: operator@itsd4350.test
        send_resolved: true
        require_tls: false
    webhook_configs:
      - url: http://alert-sink:8080/alerts
        send_resolved: true
